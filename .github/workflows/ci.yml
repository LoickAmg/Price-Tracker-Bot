name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer le projet (dev + web, sans navigateur Playwright)
        run: pip install -e ".[dev,web]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q