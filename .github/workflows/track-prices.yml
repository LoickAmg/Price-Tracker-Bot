name: Track prices

on:
  schedule:
    # Toutes les 6h. Ajuste selon tes besoins — pas la peine d'aller plus
    # souvent que ce que les sites suivis tolèrent (voir leur robots.txt/ToS).
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # bouton "Run workflow" manuel, utile pour tester

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -e .

      - name: Scraper les produits et mettre à jour l'historique
        env:
          # Secrets optionnels (Settings → Secrets and variables → Actions).
          # Absents = notification correspondante simplement ignorée.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m price_tracker

      - name: Commit l'historique s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/price-history.json
          git diff --staged --quiet && echo "Rien de nouveau à commit." || git commit -m "Mise à jour de l'historique des prix"
          git push