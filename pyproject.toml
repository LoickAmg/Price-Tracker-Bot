[project]
name = "price-tracker-bot"
version = "0.1.0"
description = "Bot de suivi de prix : scraping générique (URL + sélecteur CSS), historique versionné dans le repo, notifications Discord/Email, dashboard statique."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.scripts]
price-tracker = "price_tracker.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
